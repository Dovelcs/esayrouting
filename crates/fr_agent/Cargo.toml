[package]
name = "fr_agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fastroute_agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

cpsat-rs = "=0.1.2"
fr-engine = { path = "../fr-engine" }
awx_grid = { path = "../awx_grid" }
fr-geom = { path = "../fr-geom" }
fr-io = { path = "../fr-io" }
fr-settings = { path = "../fr-settings" }

rstar = "0.12"

fr-dsn = { path = "../fr-dsn" }

sha2 = "0.10"

tempfile = "3"

prost = "0.13"

sha1 = "0.10"

[build-dependencies]
cc = "1"
